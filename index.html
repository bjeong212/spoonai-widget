<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Spoon | Fine Dining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm p-6 mb-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-amber-600">The Golden Spoon 🥄</h1>
            <nav class="space-x-4">
                <a href="#" class="hover:text-amber-600">Menu</a>
                <a href="#" class="hover:text-amber-600">Reservations</a>
                <a href="#" class="hover:text-amber-600">Contact</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <h2 class="text-4xl font-bold mb-4">Taste the Future.</h2>
        <p class="text-lg text-gray-600 mb-8">Experience modern fusion cuisine in the heart of the city.</p>
        <div class="bg-amber-100 p-8 rounded-lg border border-amber-200">
            <p class="font-semibold">⬇️ Look to the bottom right!</p>
            <p>This is where SpoonAI lives. Click the chat icon to test the integration.</p>
        </div>
    </main>

    <div id="spoonai-widget-container" class="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-3">
        
        <div id="spoonai-chat-window" class="hidden w-80 h-96 bg-white rounded-lg shadow-2xl border border-gray-200 flex flex-col overflow-hidden transition-all duration-300 ease-in-out transform origin-bottom-right scale-95 opacity-0">
            
            <div class="bg-amber-600 p-4 text-white flex justify-between items-center">
                <div class="font-semibold">SpoonAI Assistant</div>
                <button id="spoonai-close-btn" class="text-white hover:text-gray-200 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div id="spoonai-messages" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col gap-3">
                </div>

            <div class="p-3 bg-white border-t border-gray-200 flex gap-2">
                <input type="text" id="spoonai-input" placeholder="Ask about our menu..." 
                    class="flex-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                <button id="spoonai-send-btn" class="bg-amber-600 text-white p-2 rounded-md hover:bg-amber-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>

        <button id="spoonai-toggle-btn" class="bg-amber-600 text-white p-4 rounded-full shadow-lg hover:bg-amber-700 transition transform hover:scale-105">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
        </button>
    </div>

    <script src="widget.js"></script>
    </body>
</html>
