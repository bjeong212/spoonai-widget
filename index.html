<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Spoon | Modern Dining</title>
    <style>
        /* --- MODERN RESET & TYPOGRAPHY --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #f5f5f5; /* Off-white text */
            background-color: #1a1a1a; /* Dark base */
            overflow-x: hidden;
        }

        /* --- SMOKE EFFECT BACKGROUND --- */
        .smoke-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(125deg, #1a1a1a, #2c2c2c, #3d3d3d, #1a1a1a);
            background-size: 400% 400%;
            animation: smokeMove 15s ease infinite;
        }
        @keyframes smokeMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            backdrop-filter: blur(2px);
        }
        h1 {
            font-size: 4rem;
            font-weight: 200; /* Thin, elegant font */
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            letter-spacing: 0.2rem;
            max-width: 600px;
            line-height: 1.6;
        }
        
        /* --- MOCK CONTENT (To make it scrollable) --- */
        .content {
            padding: 4rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            border-top: 1px solid #333;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }
        .menu-item h3 { font-weight: 400; font-size: 1.5rem; }
        .menu-item span { color: #888; }
    </style>
</head>
<body>

    <div class="smoke-bg"></div>

    <div class="hero">
        <h1>The Golden Spoon</h1>
        <p class="subtitle">EXPERIENCE THE ART OF MODERN ITALIAN CUISINE.</p>
        <p style="margin-top: 2rem; font-size: 0.9rem; color: #666;">EST. 2024 • MINNEAPOLIS</p>
    </div>

    <div class="content">
        <div class="menu-item">
            <h3>Osso Buco Milanese</h3>
            <span>$42</span>
        </div>
        <div class="menu-item">
            <h3>Lobster Ravioli</h3>
            <span>$38</span>
        </div>
        <div class="menu-item">
            <h3>Truffle Beef Carpaccio</h3>
            <span>$24</span>
        </div>
    </div>

    <script>
        // 1. Identify the Client (Matches your 'demo_restaurant' config)
        window.SPOONAI_CLIENT_ID = "demo_restaurant";
    </script>
    
    <div id="spoonai-widget-container"></div>
    
    <script src="widget.js" defer></script>

</body>
</html>
